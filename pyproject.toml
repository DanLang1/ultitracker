[project]
name = "tactical-pan-studio"
version = "0.1.0"
description = "Local tactical auto-pan processing for fixed wide-angle ultimate footage"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flask>=3.1,<4",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "ultralytics>=8.3,<9",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
